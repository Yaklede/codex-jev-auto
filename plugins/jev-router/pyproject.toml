[project]
name = "jev-router"
version = "0.1.0"
description = "Local Open Jev router for Codex model and reasoning effort selection"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "openai-codex>=0.1",
  "starlette>=0.48,<1",
  "tomlkit>=0.13,<1",
  "uvicorn>=0.35,<1",
  "websockets>=13,<17",
  "zstandard>=0.23,<1",
]

[project.scripts]
jev-auto = "jev_router.auto_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_router"]

[dependency-groups]
dev = ["mcp>=1.15,<2", "pytest>=8,<10"]
