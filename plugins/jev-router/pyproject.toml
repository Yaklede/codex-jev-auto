[project]
name = "jev-router"
version = "0.1.0"
description = "Local Open Jev router for Codex model and reasoning effort selection"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=1.15,<2",
  "openai-codex>=0.1",
]

[project.scripts]
jev-router-mcp = "jev_router.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_router"]

[dependency-groups]
dev = ["pytest>=8,<10"]
